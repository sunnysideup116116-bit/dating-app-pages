name: Build DatingApp Web

on:
  repository_dispatch:
    types: [datingapp_updated]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'DatingApp 的分支或 commit SHA'
        required: false
        default: main
        type: string

concurrency:
  group: datingapp-pages-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.3'

jobs:
  build-and-deploy:
    name: Build and deploy DatingApp Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages workflow
        uses: actions/checkout@v4

      - name: Resolve DatingApp source ref
        id: source
        env:
          DISPATCH_SHA: ${{ github.event.client_payload.source_sha }}
          DISPATCH_REF: ${{ github.event.client_payload.source_ref }}
          MANUAL_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -euo pipefail
          source_ref="${DISPATCH_SHA:-${DISPATCH_REF:-${MANUAL_REF:-main}}}"
          echo "ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "Building edwinchu0711/DatingApp at $source_ref"

      - name: Validate DatingApp source token
        env:
          DATINGAPP_READ_TOKEN: ${{ secrets.DATINGAPP_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATINGAPP_READ_TOKEN:-}" ]]; then
            echo "::error::Missing required secret DATINGAPP_READ_TOKEN. Grant it read-only access to edwinchu0711/DatingApp."
            exit 1
          fi

      - name: Checkout DatingApp source
        uses: actions/checkout@v4
        with:
          repository: edwinchu0711/DatingApp
          ref: ${{ steps.source.outputs.ref }}
          path: DatingApp
          token: ${{ secrets.DATINGAPP_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
          cache: true

      - name: Get dependencies
        working-directory: DatingApp
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: DatingApp
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run unit and widget regression tests
        working-directory: DatingApp
        run: flutter test --no-pub

      - name: Build Flutter Web
        working-directory: DatingApp
        run: bash scripts/build_web.sh --base-href=/dating-app-pages/

      - name: Keep this workflow on the Pages branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p DatingApp/build/web/.github/workflows
          cp .github/workflows/build-datingapp-web.yml \
            DatingApp/build/web/.github/workflows/build-datingapp-web.yml

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./DatingApp/build/web
          publish_branch: gh-pages
          force_orphan: true
          full_commit_message: >-
            deploy: edwinchu0711/DatingApp@${{ steps.source.outputs.ref }}
